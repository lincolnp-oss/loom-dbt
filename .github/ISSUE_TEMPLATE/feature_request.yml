name: Feature request
description: Propose a capability for Loom
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Loom is deliberately non-prescriptive and avoids speculative
        surface: requests land best when they start from a concrete
        practitioner problem.
  - type: textarea
    id: problem
    attributes:
      label: Practitioner problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: A concrete project situation where this would help
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
